name: Ubuntu Compatibility, RBAC and Offline Bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 / system Python 3.10
            os: ubuntu-22.04
            os_version: "22.04"
            python: "3.10"
          - name: Ubuntu 24.04 / system Python 3.12
            os: ubuntu-24.04
            os_version: "24.04"
            python: "3.12"
          - name: Ubuntu 26.04 / system Python 3.14
            os: ubuntu-26.04
            os_version: "26.04"
            python: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm operating system and default Python
        shell: bash
        run: |
          cat /etc/os-release
          python3 --version
          python3 - <<PY
          import sys
          from pathlib import Path
          expected = tuple(map(int, "${{ matrix.python }}".split(".")))
          actual = sys.version_info[:2]
          assert actual == expected, f"Expected system Python {expected}, found {actual}"
          values = {}
          for raw in Path('/etc/os-release').read_text().splitlines():
              if '=' in raw:
                  k, v = raw.split('=', 1)
                  values[k] = v.strip().strip('"')
          assert values.get('VERSION_ID') == "${{ matrix.os_version }}", values
          PY

      - name: Install OS prerequisites for CI builder
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          if apt-cache show 7zip >/dev/null 2>&1; then
            sudo apt-get install -y 7zip
          elif apt-cache show p7zip-full >/dev/null 2>&1; then
            sudo apt-get install -y p7zip-full
          fi

      - name: Validate deployment and benchmark script syntax
        shell: bash
        run: |
          bash -n scripts/deploy_staging.sh
          bash -n scripts/build_offline_bundle.sh
          bash -n scripts/install_offline.sh
          bash -n scripts/start_production.sh
          python3 -m py_compile scripts/check_bundle_compatibility.py
          python3 -m py_compile scripts/staging_acceptance.py
          python3 -m py_compile scripts/benchmark_performance.py

      - name: Create clean virtual environment
        shell: bash
        run: |
          rm -rf .venv
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install complete locked dependency chain
        shell: bash
        run: |
          .venv/bin/python -m pip install -r requirements-lock.txt -r requirements-ci.txt
          .venv/bin/python -m pip freeze

      - name: Verify deployment environment and dependency lock
        run: .venv/bin/python scripts/verify_environment.py

      - name: Run authentication and functional smoke tests
        run: .venv/bin/python -m pytest -q tests

      - name: Run 1 MB performance benchmark smoke test
        run: .venv/bin/python scripts/benchmark_performance.py --sizes-mb 1 --output-dir /tmp/sanitization-benchmark-ci

      - name: Validate Gunicorn production configuration
        run: .venv/bin/gunicorn --check-config --config gunicorn.conf.py wsgi:application

      - name: Confirm staging acceptance checker CLI
        run: .venv/bin/python scripts/staging_acceptance.py --help

      - name: Confirm performance benchmark CLI
        run: .venv/bin/python scripts/benchmark_performance.py --help

      - name: Confirm command-line entry point
        run: .venv/bin/python main.py --help

  offline-bundle:
    name: Offline bundle / Ubuntu ${{ matrix.os_version }} / Python ${{ matrix.python }}
    needs: compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            os_version: "22.04"
            python: "3.10"
          - os: ubuntu-24.04
            os_version: "24.04"
            python: "3.12"
          - os: ubuntu-26.04
            os_version: "26.04"
            python: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare builder
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m pip install --upgrade pip
          mkdir -p dist

      - name: Build OS-specific wheelhouse and deployment archive
        run: bash scripts/build_offline_bundle.sh

      - name: Install bundle with all Python network access disabled
        shell: bash
        run: |
          mkdir -p /tmp/sanitization-offline-test
          tar -xzf dist/SanitizationApp-v2.1-Ubuntu${{ matrix.os_version }}-Python${{ matrix.python }}-*-offline.tar.gz -C /tmp/sanitization-offline-test
          cd /tmp/sanitization-offline-test/SanitizationApp-v2.1-Ubuntu${{ matrix.os_version }}-Python${{ matrix.python }}-*-offline
          test -f RUNTIME_MANIFEST.json
          test -f requirements-lock.txt
          test -f dependency/requirements.txt
          test -f dependency/requirements-lock.txt
          test -f dependency/WHEELS_SHA256SUMS.txt
          test -n "$(find dependency/wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -f scripts/deploy_staging.sh
          test -f scripts/check_bundle_compatibility.py
          test -f scripts/staging_acceptance.py
          test -f scripts/benchmark_performance.py
          bash -n scripts/deploy_staging.sh
          python3 scripts/check_bundle_compatibility.py RUNTIME_MANIFEST.json
          PIP_NO_INDEX=1 bash scripts/install_offline.sh
          .venv/bin/python scripts/verify_environment.py
          .venv/bin/python main.py --help
          .venv/bin/python scripts/staging_acceptance.py --help
          .venv/bin/python scripts/benchmark_performance.py --help
          .venv/bin/gunicorn --check-config --config gunicorn.conf.py wsgi:application

      - name: Upload tested offline package
        uses: actions/upload-artifact@v4
        with:
          name: SanitizationApp-v2.1-Ubuntu${{ matrix.os_version }}-Python${{ matrix.python }}-offline
          path: |
            dist/SanitizationApp-v2.1-Ubuntu${{ matrix.os_version }}-Python${{ matrix.python }}-*-offline.tar.gz
            dist/SanitizationApp-v2.1-Ubuntu${{ matrix.os_version }}-Python${{ matrix.python }}-*-offline.tar.gz.sha256
          if-no-files-found: error
